name: Research candidate 01 AMR cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run lifecycle RED/GREEN model
        run: python3 research/candidate_01_sample_pp_amr_cache.py
      - name: Run C++ cache lifecycle RED/GREEN harness
        run: |
          cat > /tmp/cache_lifecycle.cpp <<'CPP'
          #include <iostream>
          #include <vector>
          int main() {
            std::vector<int> cache{0, 1};
            cache.insert(cache.end(), {2, 0, 1});
            std::vector<int> buggy(cache.begin(), cache.begin() + 3);
            std::vector<int> fixed{2, 0, 1};
            if (buggy == fixed) return 1;
            std::cout << "RED stale=" << buggy[0] << " GREEN current=" << fixed[0] << '\\n';
          }
          CPP
          g++ -std=c++17 -Wall -Wextra /tmp/cache_lifecycle.cpp -o /tmp/cache_lifecycle
          /tmp/cache_lifecycle
      - name: Pin production cache lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('framework/src/transfers/MultiAppVariableValueSamplePostprocessorTransfer.C')
          s = p.read_text()
          assert 'void\nMultiAppVariableValueSamplePostprocessorTransfer::meshChanged()' in s
          assert 'cacheElemToPostprocessorData();' in s
          marker = 'void\nMultiAppVariableValueSamplePostprocessorTransfer::cacheElemToPostprocessorData()'
          body = s[s.index(marker):s.index('void\nMultiAppVariableValueSamplePostprocessorTransfer::initialSetup()')]
          assert '_cached_multiapp_pos_ids.clear()' not in body
          assert '_needed_postprocessors.clear()' not in body
          print('verified append-only cache rebuild on pinned production source')
          PY
