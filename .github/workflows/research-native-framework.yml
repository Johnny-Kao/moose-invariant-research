name: Research native framework build probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: moose-ci
          auto-activate-base: false
          miniforge-version: latest
          channels: conda-forge,https://conda.software.inl.gov/public
          channel-priority: strict
      - name: Install published MOOSE build dependencies
        shell: bash -el {0}
        run: conda install --yes moose-dev
      - name: Build MooseTestApp against published dependencies
        shell: bash -el {0}
        run: |
          export LIBMESH_DIR="$CONDA_PREFIX"
          export METHOD=opt
          make -C test -j2
      - name: Record native build result
        shell: bash -el {0}
        run: test -x test/moose_test-opt
      - name: Run existing MultiApp transfer baseline
        shell: bash -el {0}
        run: |
          export PATH="$PWD/test:$PATH"
          cd test/tests/transfers/multiapp_variable_value_sample_transfer
          ../../../moose_test-opt -i pp_parent.i --no-color
      - name: Run native AMR cache probe
        shell: bash -el {0}
        run: |
          export PATH="$PWD/test:$PATH"
          cd test/tests/transfers/multiapp_variable_value_sample_transfer
          ../../../moose_test-opt -i amr_cache_probe.i --no-color
          test -f amr_cache_probe_out.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path("amr_cache_probe_out.csv").open()))
          assert rows, "AMR probe produced no CSV rows"
          values = [float(row["diff_average"]) for row in rows if row.get("diff_average")]
          assert values, "AMR probe did not report diff_average"
          assert max(abs(v) for v in values) < 1e-12, values
          PY
